name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ${{ fromJSON(vars.PRIMARY_LINUX_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Scan repository for committed secrets
        run: nix develop --command gitleaks detect --source . --redact --verbose

  build-and-test:
    name: build-and-test
    # R331: legacy tinyland-inc/GloriousFlywheel is private now; the shared
    # tinyland-nix org pool is also unreachable from this out-of-org personal
    # account. Runs on the owner-overlay capability class (jesssullivan-nix,
    # jesssullivan-infra) instead of a GitHub-hosted fallback — v3.0.0
    # (TIN-3914) retired hosted runners estate-wide, and jesssullivan-nix is
    # the reviewed replacement for this repo's lane.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    env:
      GF_BAZEL_CONFIG: flywheel
    steps:
      - uses: actions/checkout@v6

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Setup, check, build
        run: |
          nix develop --command just setup
          nix develop --command just check
          nix develop --command just substrate-boundary-check
          nix develop --command just build

  bazel-graph:
    name: bazel-graph
    # R331: see build-and-test above — owner-overlay capability class.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    env:
      GF_BAZEL_CONFIG: flywheel
    steps:
      - uses: actions/checkout@v6

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Bazel graph + build
        run: |
          nix develop --command bazelisk mod graph
          nix develop --command bazelisk build --config=flywheel //:node_modules
